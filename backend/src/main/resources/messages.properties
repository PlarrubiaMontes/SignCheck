# Plain-language reason for a non-valid signature, keyed by its ETSI EN 319 102-1 sub-indication.
# Spanish: messages_es.properties. Every DSS SubIndication must have an entry (checked by VerdictMessagesTest).
reason.FORMAT_FAILURE=The signature is not formatted correctly, so it cannot be checked.
reason.HASH_FAILURE=The document was modified after it was signed.
reason.SIG_CRYPTO_FAILURE=The signature value does not match the signer's key: the signature is broken or forged.
reason.REVOKED=The signer's certificate was revoked before the document was signed.
reason.EXPIRED=The signer's certificate had expired when the document was signed.
reason.NOT_YET_VALID=The signer's certificate was not yet valid when the document was signed.
reason.SIG_CONSTRAINTS_FAILURE=The signature does not meet the requirements of the validation policy.
reason.CHAIN_CONSTRAINTS_FAILURE=A certificate in the signer's chain does not meet the requirements of the validation policy.
reason.CERTIFICATE_CHAIN_GENERAL_FAILURE=The signer's certificate chain could not be fully checked (for example, no usable revocation information).
reason.CRYPTO_CONSTRAINTS_FAILURE=The signature uses an algorithm or key size that is no longer considered secure.
reason.POLICY_PROCESSING_ERROR=The signature policy referenced by the signature could not be processed.
reason.SIGNATURE_POLICY_NOT_AVAILABLE=The signature policy referenced by the signature is not available.
reason.TIMESTAMP_ORDER_FAILURE=The timestamps in the signature are not in a consistent order.
reason.NO_SIGNING_CERTIFICATE_FOUND=The signer's certificate could not be found.
reason.NO_CERTIFICATE_CHAIN_FOUND=The signer's certificate does not lead to a trusted authority.
reason.NO_CERTIFICATE_CHAIN_FOUND_NO_POE=The signer's certificate does not lead to a trusted authority, and there is no proof of when the document was signed.
reason.REVOKED_NO_POE=The signer's certificate has been revoked, and there is no proof that the document was signed before that.
reason.REVOKED_CA_NO_POE=A certificate authority in the signer's chain has been revoked, and there is no proof that the document was signed before that.
reason.OUT_OF_BOUNDS_NOT_REVOKED=The signer's certificate has expired or is not yet valid (it was not revoked).
reason.OUT_OF_BOUNDS_NO_POE=The signer's certificate is outside its validity period, and there is no proof of when the document was signed.
reason.REVOCATION_OUT_OF_BOUNDS_NO_POE=The revocation information is outside its validity period, and there is no proof of when the document was signed.
reason.CRYPTO_CONSTRAINTS_FAILURE_NO_POE=The signature uses an algorithm that is no longer secure, and there is no proof that the document was signed while it still was.
reason.NO_POE=There is no proof of when the document was signed.
reason.TRY_LATER=Not all the information needed to check the signature is available yet. Try again later.
reason.SIGNED_DATA_NOT_FOUND=The signed document is missing. For detached signatures, also upload the original document.
reason.ATTESTATION_CONSTRAINTS_FAILURE=An attestation linked to the signature does not meet the requirements of the validation policy.
