# Motivo en lenguaje llano de una firma no válida, por sub-indicación ETSI EN 319 102-1. Codificación UTF-8.
reason.FORMAT_FAILURE=La firma no tiene un formato correcto, así que no se puede comprobar.
reason.HASH_FAILURE=El documento se modificó después de firmarse.
reason.SIG_CRYPTO_FAILURE=El valor de la firma no corresponde a la clave del firmante: la firma está rota o falsificada.
reason.REVOKED=El certificado del firmante estaba revocado antes de firmarse el documento.
reason.EXPIRED=El certificado del firmante había caducado cuando se firmó el documento.
reason.NOT_YET_VALID=El certificado del firmante aún no era válido cuando se firmó el documento.
reason.SIG_CONSTRAINTS_FAILURE=La firma no cumple los requisitos de la política de validación.
reason.CHAIN_CONSTRAINTS_FAILURE=Un certificado de la cadena del firmante no cumple los requisitos de la política de validación.
reason.CERTIFICATE_CHAIN_GENERAL_FAILURE=No se ha podido comprobar del todo la cadena de certificados del firmante (por ejemplo, no hay información de revocación utilizable).
reason.CRYPTO_CONSTRAINTS_FAILURE=La firma usa un algoritmo o tamaño de clave que ya no se considera seguro.
reason.POLICY_PROCESSING_ERROR=No se ha podido procesar la política de firma a la que hace referencia la firma.
reason.SIGNATURE_POLICY_NOT_AVAILABLE=La política de firma a la que hace referencia la firma no está disponible.
reason.TIMESTAMP_ORDER_FAILURE=Los sellos de tiempo de la firma no siguen un orden coherente.
reason.NO_SIGNING_CERTIFICATE_FOUND=No se ha encontrado el certificado del firmante.
reason.NO_CERTIFICATE_CHAIN_FOUND=El certificado del firmante no lleva a ninguna autoridad de confianza.
reason.NO_CERTIFICATE_CHAIN_FOUND_NO_POE=El certificado del firmante no lleva a ninguna autoridad de confianza y no hay prueba de cuándo se firmó el documento.
reason.REVOKED_NO_POE=El certificado del firmante ha sido revocado y no hay prueba de que el documento se firmara antes.
reason.REVOKED_CA_NO_POE=Una autoridad de certificación de la cadena del firmante ha sido revocada y no hay prueba de que el documento se firmara antes.
reason.OUT_OF_BOUNDS_NOT_REVOKED=El certificado del firmante ha caducado o aún no es válido (no ha sido revocado).
reason.OUT_OF_BOUNDS_NO_POE=El certificado del firmante está fuera de su periodo de validez y no hay prueba de cuándo se firmó el documento.
reason.REVOCATION_OUT_OF_BOUNDS_NO_POE=La información de revocación está fuera de su periodo de validez y no hay prueba de cuándo se firmó el documento.
reason.CRYPTO_CONSTRAINTS_FAILURE_NO_POE=La firma usa un algoritmo que ya no es seguro y no hay prueba de que se firmara cuando aún lo era.
reason.NO_POE=No hay prueba de cuándo se firmó el documento.
reason.TRY_LATER=Todavía no está disponible toda la información necesaria para comprobar la firma. Inténtalo más tarde.
reason.SIGNED_DATA_NOT_FOUND=Falta el documento firmado. En firmas separadas (detached), sube también el documento original.
reason.ATTESTATION_CONSTRAINTS_FAILURE=Una atestación vinculada a la firma no cumple los requisitos de la política de validación.
