# Serves the Angular app and proxies the API, so browser and API share one origin (no CORS needed).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Signed file + originals (matches signcheck.upload.max-request-size)
    client_max_body_size 60m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Uploads are streamed to the backend, not buffered to disk (documents are never persisted)
        proxy_request_buffering off;
    }

    # Single-page app: unknown paths (e.g. /result) load index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
